name: Validate source and generated userscripts

on:
  pull_request:
  push:
    branches:
      - main
      - "optimize/**"
      - "refactor/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        # 仅安装容错：安装失败时测试步骤会显式失败，不再静默跳过
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Run browser regression tests
        # 2.0.0 起浏览器回归为必过项：安装失败会导致后续测试失败并显式标红，不再静默放行
        run: npm run test:browser

      - name: Verify generated userscripts
        run: npm run build:check

      - name: Check userscript syntax
        run: |
          node --check urppp.user.js
          node --check urpppp.user.js

      - name: Check whitespace
        run: git diff --check
