name: Validate source and generated userscripts

on:
  pull_request:
  push:
    branches:
      - main
      - "optimize/**"
      - "refactor/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Run browser regression tests
        run: npm run test:browser

      - name: Verify generated userscripts
        run: npm run build:check

      - name: Check userscript syntax
        run: |
          node --check urppp.user.js
          node --check urpppp.user.js

      - name: Check whitespace
        run: git diff --check
