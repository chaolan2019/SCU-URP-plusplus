name: Validate source and generated userscripts

on:
  pull_request:
  push:
    branches:
      - main
      - "optimize/**"
      - "refactor/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Run browser regression tests
        run: npm run test:browser

      - name: Verify generated userscripts
        run: npm run build:check

      - name: Check userscript syntax
        run: |
          node --check urppp.user.js
          node --check urpppp.user.js

      - name: Check whitespace
        run: git diff --check
