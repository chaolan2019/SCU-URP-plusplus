<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-label="SCU URP++">
  <title>SCU URP++</title>
  <rect width="1200" height="280" fill="#0B0F17"/>
  <!-- terminal chrome -->
  <rect x="24" y="20" width="1152" height="240" rx="14" fill="#111827" stroke="#B53434" stroke-width="2"/>
  <circle cx="56" cy="48" r="7" fill="#B53434" opacity="0.9"/>
  <circle cx="82" cy="48" r="7" fill="#B53434" opacity="0.45"/>
  <circle cx="108" cy="48" r="7" fill="#B53434" opacity="0.25"/>
  <text x="140" y="53" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">scu@urp++</text>

  <!-- big CLI wordmark -->
  <g fill="#B53434" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-weight="800" letter-spacing="2">
    <text x="60" y="175" font-size="92">SCU URP++</text>
  </g>

  <!-- prompt line -->
  <text x="60" y="220" fill="#B53434" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600">$</text>
  <text x="84" y="220" fill="#E5E7EB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">beautify zhjw.scu.edu.cn</text>
  <rect x="330" y="204" width="10" height="20" fill="#B53434">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
