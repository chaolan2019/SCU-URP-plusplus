<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>SCU URP++</title>
  <!-- 终端黑圆底 + 窗口细环 -->
  <circle cx="64" cy="64" r="62" fill="#17191F"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#262A33" stroke-width="4"/>
  <!-- 像素字模 URP（3x5 字模，格 7px，暖白） -->
  <g fill="#E8E3D8">
    <!-- U -->
    <rect x="26" y="46" width="7" height="35"/>
    <rect x="40" y="46" width="7" height="35"/>
    <rect x="26" y="74" width="21" height="7"/>
    <!-- R：XX. / X.X / XX. / X.X / X.X -->
    <rect x="54" y="46" width="7" height="35"/>
    <rect x="54" y="46" width="14" height="7"/>
    <rect x="68" y="53" width="7" height="7"/>
    <rect x="54" y="60" width="14" height="7"/>
    <rect x="68" y="67" width="7" height="14"/>
    <!-- P：XX. / X.X / XX. / X.. / X.. -->
    <rect x="82" y="46" width="7" height="35"/>
    <rect x="82" y="46" width="14" height="7"/>
    <rect x="96" y="53" width="7" height="7"/>
    <rect x="82" y="60" width="14" height="7"/>
  </g>
  <!-- 红色 ++ 竖叠右上角（3x3 加号字模，格 4px） -->
  <g fill="#C9403F">
    <rect x="101" y="28" width="4" height="12"/>
    <rect x="96.5" y="32" width="13" height="4"/>
    <rect x="101" y="48" width="4" height="12"/>
    <rect x="96.5" y="52" width="13" height="4"/>
  </g>
</svg>
