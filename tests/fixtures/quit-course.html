<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>退课 fixture</title>
  <style>
    html, body { margin: 0; color: #393939; background: #fff; font: 14px Arial, sans-serif; }
    .page-content { padding: 16px; }
    .toolbar { margin-bottom: 10px; }
    .table { border-collapse: collapse; }
    .table td, .table th { border: 1px solid #ddd; padding: 8px 12px; white-space: nowrap; }
    .fa-trash-o { display: inline-block; width: 14px; height: 14px; background: #d9534f; cursor: pointer; }
    /* 复刻 layui 1.x 原生 dialog 外观：内容节点是 id 形态，样式应由插件接管，
       这里给出被覆盖的原始值。top/left 由内联样式给，与真实 DOM 一致 */
    .layui-layer { position: fixed; z-index: 19891016; background: #fff; border-radius: 2px; box-shadow: 1px 1px 50px rgba(0,0,0,.3); }
    .layui-layer-title { height: 42px; line-height: 42px; padding: 0 80px 0 20px; background: #F8F8F8; border-bottom: 1px solid #eee; }
    #layui-layer-content { padding: 16px 20px; }
    .layui-layer-btn { padding: 0 12px 12px; text-align: right; }
    .layui-layer-btn a { display: inline-block; height: 30px; line-height: 30px; padding: 0 14px; margin-left: 8px; border: 1px solid #dedede; background: #f8f8f8; color: #333; text-decoration: none; }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <div class="page-content" id="page-content-template">
      <!-- 表头照抄真实页面：首列是操作（图标无文字），课程名在第 4 列 -->
      <div class="toolbar">
        <button type="button" id="toolbar-btn" onclick="bulkQuit()">批量退课</button>
      </div>
      <table class="table">
        <thead>
          <tr>
            <th>操作</th><th>培养方案</th><th>课程号</th><th>课程名</th><th>学分</th>
            <th>课程属性</th><th>考试类型</th><th>教师</th><th>修读方式</th><th>选课状态</th>
            <th>周次</th><th>星期</th><th>节次</th><th>节数</th><th>校区</th><th>教室</th><th>教学楼</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <i class="fa-trash-o" id="quit-btn" title="退课" onclick="quitSel('202503250927','105806020','01','01')"></i>
              <i class="fa-trash-o" id="other-btn" title="选课冲突提示" onclick="showConflict()"></i>
            </td>
            <td>电气电子创新设计（微专业）教学计划</td>
            <td>105806020</td>
            <td>跨文化实用交际_28</td>
            <td>2.0</td>
            <td>选修</td>
            <td>考查</td>
            <td>王芳</td>
            <td>自选</td>
            <td>已选</td>
            <td>1-16周</td>
            <td>周三</td>
            <td>3-4节</td>
            <td>2</td>
            <td>江安</td>
            <td>A101</td>
            <td>一教A座</td>
          </tr>
          <tr>
            <td>
              <i class="fa-trash-o" id="quit-btn-2" title="退课" onclick="quitSel('202503250928','105806021','02','01')"></i>
            </td>
            <td>自动化培养方案</td>
            <td>105806021</td>
            <td>世界民族问题研究_01</td>
            <td>2.0</td>
            <td>必修</td>
            <td>考试</td>
            <td>李明</td>
            <td>自选</td>
            <td>已选</td>
            <td>1-16周</td>
            <td>周四</td>
            <td>5-6节</td>
            <td>2</td>
            <td>江安</td>
            <td>B201</td>
            <td>二教</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
  <script>
    window.__dialogOpened = 0;
    window.__confirmCallbackFired = null;
    window.__deleteRequested = false;
    var layerSeq = 0;

    // 复刻真实页面的确认框：由页面自己的脚本拼出 layui 1.x 的 dialog DOM。
    // 刻意既不挂 window.layer 也不挂 window.urp —— 增强不该依赖它们
    //（真实页面上这两个全局都不保证存在，挂上去拿不到就静默失效）。
    function openConfirm(message, onOk, onCancel) {
      window.__dialogOpened += 1;
      layerSeq += 1;
      var dialog = document.createElement('div');
      dialog.className = 'layui-layer layui-layer-dialog layer-anim';
      dialog.id = 'layui-layer' + layerSeq;
      dialog.setAttribute('type', 'dialog');
      dialog.setAttribute('times', String(layerSeq));
      dialog.setAttribute('showtime', '0');
      dialog.setAttribute('contype', 'string');
      dialog.style.cssText = 'z-index: 19891016; top: 485px; left: 643px;';
      dialog.innerHTML = '<div class="layui-layer-title" style="cursor: move;">提示信息</div>'
        + '<div id="layui-layer-content"></div>'
        + '<span class="layui-layer-setwin"></span>'
        + '<div class="layui-layer-btn"><a class="layui-layer-btn0">确定</a><a class="layui-layer-btn1">取消</a></div>';
      dialog.querySelector('#layui-layer-content').textContent = message;
      dialog.querySelector('.layui-layer-btn0').onclick = function () { dialog.remove(); onOk(); };
      dialog.querySelector('.layui-layer-btn1').onclick = function () { dialog.remove(); onCancel(); };
      document.body.appendChild(dialog);
    }

    function quitSel(fajhh, kch, kxh, xdfsdm) {
      openConfirm('是否确定要删除此门课程？', function () {
        window.__confirmCallbackFired = true;
        window.__deleteRequested = true;
      }, function () {
        window.__confirmCallbackFired = false;
      });
    }

    function showConflict() {
      openConfirm('选课时间冲突，请重新选择时间段', function () {}, function () {});
    }

    // 表格外的按钮：没有点过任何一行，不该凭空补上某个课程名
    function bulkQuit() {
      openConfirm('是否确定要删除所选课程？', function () {}, function () {});
    }
  </script>
</body>
</html>
