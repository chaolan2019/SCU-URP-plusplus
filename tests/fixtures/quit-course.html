<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>退课 fixture</title>
  <style>
    html, body { margin: 0; color: #393939; background: #fff; font: 14px Arial, sans-serif; }
    .page-content { padding: 16px; }
    .table { border-collapse: collapse; }
    .table td, .table th { border: 1px solid #ddd; padding: 8px 12px; white-space: nowrap; }
    .fa-trash-o { display: inline-block; width: 14px; height: 14px; background: #d9534f; cursor: pointer; }
    /* 复刻 layui 原生 dialog 外观：样式应由插件接管，这里给出被覆盖的原始值。
       z-index 与定位也照真实值给，否则夹具里的 sidebar 会挡住弹窗 */
    .layui-layer { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 19891016; background: #fff; border-radius: 2px; box-shadow: 1px 1px 50px rgba(0,0,0,.3); }
    .layui-layer-title { height: 42px; line-height: 42px; padding: 0 80px 0 20px; background: #F8F8F8; border-bottom: 1px solid #eee; }
    .layui-layer-content { padding: 16px 20px; }
    .layui-layer-btn { padding: 0 12px 12px; text-align: right; }
    .layui-layer-btn a { display: inline-block; height: 30px; line-height: 30px; padding: 0 14px; margin-left: 8px; border: 1px solid #dedede; background: #f8f8f8; color: #333; text-decoration: none; }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <div class="page-content" id="page-content-template">
      <!-- 表头照抄真实页面：首列是操作（图标无文字），课程名在第 4 列 -->
      <table class="table">
        <thead>
          <tr>
            <th>操作</th><th>培养方案</th><th>课程号</th><th>课程名</th><th>学分</th>
            <th>课程属性</th><th>考试类型</th><th>教师</th><th>修读方式</th><th>选课状态</th>
            <th>周次</th><th>星期</th><th>节次</th><th>节数</th><th>校区</th><th>教室</th><th>教学楼</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <i class="fa-trash-o" id="quit-btn" title="退课" onclick="quitSel('202503250927','105806020','01','01')"></i>
              <i class="fa-trash-o" id="quit-btn-direct" title="直接调 layui" onclick="directConfirm()"></i>
            </td>
            <td>电气电子创新设计（微专业）教学计划</td>
            <td>105806020</td>
            <td>跨文化实用交际_28</td>
            <td>2.0</td>
            <td>选修</td>
            <td>考查</td>
            <td>王芳</td>
            <td>自选</td>
            <td>已选</td>
            <td>1-16周</td>
            <td>周三</td>
            <td>3-4节</td>
            <td>2</td>
            <td>江安</td>
            <td>A101</td>
            <td>一教A座</td>
          </tr>
          <tr>
            <td>
              <i class="fa-trash-o" id="quit-btn-2" title="退课" onclick="quitSel('202503250928','105806021','02','01')"></i>
            </td>
            <td>自动化培养方案</td>
            <td>105806021</td>
            <td>世界民族问题研究_01</td>
            <td>2.0</td>
            <td>必修</td>
            <td>考试</td>
            <td>李明</td>
            <td>自选</td>
            <td>已选</td>
            <td>1-16周</td>
            <td>周四</td>
            <td>5-6节</td>
            <td>2</td>
            <td>江安</td>
            <td>B201</td>
            <td>二教</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
  <script>
    window.__dialogOpened = 0;
    window.__confirmCallbackFired = null;
    window.__deleteRequested = false;

    // 复刻 layui 的 layer：dialog 由它渲染，样式交给插件接管
    var layer = {
      open: function (options) {
        window.__dialogOpened += 1;
        var dialog = document.createElement('div');
        dialog.className = 'layui-layer layui-layer-dialog layer-anim';
        dialog.id = 'layui-layer-fixture';
        dialog.innerHTML = '<div class="layui-layer-title">' + (options.title || '信息') + '</div>'
          + '<div class="layui-layer-content"></div>'
          + '<div class="layui-layer-btn"></div>';
        dialog.querySelector('.layui-layer-content').innerHTML = options.content;
        var bar = dialog.querySelector('.layui-layer-btn');
        (options.btn || []).forEach(function (label, index) {
          var button = document.createElement('a');
          button.className = 'layui-layer-btn' + index;
          button.textContent = label;
          button.onclick = function () {
            dialog.remove();
            var handler = index === 0 ? options.yes : options.btn2;
            if (typeof handler === 'function') handler();
          };
          bar.appendChild(button);
        });
        document.body.appendChild(dialog);
      },
      // confirm 把回调塞进 options 再走 open，与 layui 内部一致
      confirm: function (content, options, yes, cancel) {
        var opts = {};
        for (var key in options) opts[key] = options[key];
        opts.content = content;
        opts.btn = (options && options.btn) || ['确定', '取消'];
        opts.yes = yes;
        if (cancel !== undefined) opts.btn2 = cancel;
        this.open(opts);
      }
    };
    window.layer = layer;

    function Urp() {}
    Urp.prototype = {
      confirm: function (msg, callback) {
        layer.confirm(msg, { title: '提示信息', btn: ['确定', '取消'], closeBtn: 0 }, function () {
          callback(true);
        }, function () {
          callback(false);
        });
      }
    };
    window.urp = new Urp();

    function quitSel(fajhh, kch, kxh, xdfsdm) {
      urp.confirm('是否确定要删除此门课程？', function (ok) {
        window.__confirmCallbackFired = ok;
        if (ok) window.__deleteRequested = true;
      });
    }

    // 不经过 urp.confirm 的路径：验证增强挂在 layui 上而不是页面对象上
    function directConfirm() {
      layer.confirm('是否确定要删除此门课程？', { title: '提示信息', btn: ['确定', '取消'] }, function () {
        window.__confirmCallbackFired = true;
      }, function () {
        window.__confirmCallbackFired = false;
      });
    }
  </script>
</body>
</html>
