<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>本学期课程表 fixture</title>
  <style>
    html, body { margin: 0; background: #fff; color: #393939; font: 14px Arial, sans-serif; }
    .page-content { padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    #mycoursetable { position: relative; width: 760px; }
    #courseTable { width: 100%; border-collapse: collapse; table-layout: fixed; }
    #courseTable th, #courseTable td { border: 1px solid #ddd; height: 72px; padding: 0; }
    #courseTable th { height: 34px; background: #ddd; font-weight: normal; }
    #courseTable td { position: relative; background: transparent; }
    .class_div { position: absolute; inset: 0; overflow: hidden; border-radius: 0; background: #50bd8b; }
    .class_div p { margin: 3px 5px; }
  </style>
</head>
<body>
  <div class="page-content" id="page-content-template">
    <div class="breadcrumb">选课管理 / 本学期课表</div>
    <h4 class="header" id="h4_id1">
      <span>选课管理（已安排的理论课）</span>
      <span class="label label-lg label-yellow arrowed-in">注：未安排具体时间的课程请在下方“全部理论课安排”中查看</span>
      <span class="right_top_oper">
        <button type="button" id="native-print">打印课表</button>
        <button type="button" id="native-export" onclick="exportTableToPdf(); return false;">导出课表</button>
      </span>
    </h4>
    <div id="mycoursetable">
      <table id="courseTable" class="table table-bordered">
        <thead>
          <tr><th>节次</th><th>星期一</th><th>星期二</th><th>星期三</th><th>星期四</th><th>星期五</th><th>星期六</th><th>星期日</th></tr>
        </thead>
        <tbody id="courseTableBody">
          <tr>
            <th>第一大节</th>
            <td id="1_1">
              <div class="class_div box_font div-kcb-2" classNum="1">
                <p class="p-kcm-2">工程数学</p>
                <p>1-17周 · 1-2节</p>
              </div>
            </td>
            <td id="2_1">
              <div class="class_div box_font div-kcb-2" classNum="1">
                <p class="p-kcm-2">世界民族问题研究</p>
                <p>1-17周 · 1-2节</p>
              </div>
            </td>
            <td id="3_1"></td>
            <td id="4_1"></td>
            <td id="5_1"></td>
            <td id="6_1"></td>
            <td id="7_1"></td>
          </tr>
        </tbody>
      </table>
    </div>
    <h4 id="h4_id2">全部理论课安排</h4>
    <div id="infoTable">fixture info</div>
    <div id="rwskxxbg-course"></div>
  </div>
  <script>
    window.__captureHistory = [];
    window.__nativeDivBuildCalls = 0;

    window.divBuild = function nativeDivBuild() {
      window.__nativeDivBuildCalls += 1;
      const cards = document.querySelectorAll('.class_div');
      cards.forEach((card) => {
        card.style.position = 'absolute';
        const cell = card.parentElement;
        const page = document.getElementById('page-content-template');
        const cellRect = cell.getBoundingClientRect();
        const pageRect = page.getBoundingClientRect();
        const scrollX = window.pageXOffset || document.documentElement.scrollLeft;
        const scrollY = window.pageYOffset || document.documentElement.scrollTop;
        const cellLeft = cellRect.left + scrollX;
        const cellTop = cellRect.top + scrollY;
        const pageLeft = pageRect.left + scrollX;
        const pageTop = pageRect.top + scrollY;
        const width = cellRect.width;
        const siblings = Array.from(cell.children).filter((node) => node.classList && node.classList.contains('class_div')).length;
        card.style.width = (siblings > 1 ? width / 2 : width) + 'px';
        card.style.height = '72px';
        card.style.top = (cellTop - pageTop) + 'px';
        const isSecond = siblings > 1 && Array.from(cell.children).indexOf(card) === 1;
        card.style.left = (cellLeft - pageLeft + (isSecond ? width / 2 : 0)) + 'px';
      });
    };

    window.back = function nativeBack() {
      document.querySelectorAll('.printDiv').forEach((element) => element.classList.remove('printDiv'));
      document.getElementById('courseTable').classList.add('table');
      window.divBuild();
    };

    window.html2canvas = function fakeHtml2Canvas(target) {
      const table = target.querySelector('#courseTable');
      const cell = target.querySelector('td');
      const card = target.querySelector('.class_div');
      const cardCell = card ? card.parentElement : null;
      const offsetDelta = card && cardCell ? Math.round(card.getBoundingClientRect().left - cardCell.getBoundingClientRect().left) : null;
      window.__captureHistory.push({
        tableBackground: getComputedStyle(table).backgroundColor,
        cellBackground: getComputedStyle(cell).backgroundColor,
        cardRadius: getComputedStyle(card).borderRadius,
        cardShadow: getComputedStyle(card).boxShadow,
        cardLeftPriority: card.style.getPropertyPriority('left'),
        cardOffsetDelta: offsetDelta,
      });
      return Promise.resolve(document.createElement('canvas'));
    };

    window.exportTableToPdf = function fixtureExportTableToPdf() {
      const table = document.getElementById('courseTable');
      table.classList.add('printDiv');
      table.classList.remove('table');
      window.divBuild();
      return window.html2canvas(document.getElementById('mycoursetable')).then(() => window.back());
    };
  </script>
</body>
</html>
