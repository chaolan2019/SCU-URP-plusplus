<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>成绩查询 fixture</title>
  <style>
    html, body { margin: 0; color: #393939; font: 14px Arial, sans-serif; }
    #navbar { min-height: 45px; }
    #sidebar { width: 190px; }
    .page-content { padding: 16px; }
    .form-group { margin: 8px 0; }
    .table { width: 100%; border-collapse: collapse; }
    .table th, .table td { border: 1px solid #ddd; padding: 8px; }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar"><div class="navbar-header"><a class="navbar-brand" href="/index">URP Fixture</a></div><ul class="ace-nav"></ul></nav>
  <aside class="sidebar" id="sidebar"><ul class="nav nav-list" id="menus"><li class="active"><a href="/index"><span class="menu-text">首页</span></a></li><li><a href="/student/integratedQuery/scoreQuery/allTermScores/index"><span class="menu-text">成绩查询</span></a></li></ul><div class="sidebar-collapse" id="sidebar-collapse"></div></aside>
  <main class="main-content">
    <div class="page-content" id="page-content-template">
      <div class="breadcrumb">综合查询 / 成绩查询</div>
      <h4 class="header smaller lighter grey" id="query-h4">
        <i class="ace-icon fa fa-search"></i> 查询条件
        <span class="right_top_oper">
          <button class="btn btn-info btn-xs btn-round" onclick="search();return false;">查询</button>
        </span>
      </h4>
      <form id="queryInfo" name="queryInfo">
        <div class="profile-user-info profile-user-info-striped self">
          <div class="profile-info-row">
            <div class="profile-info-name">学年学期</div>
            <div class="profile-info-value"><select class="selectwidth chosen-select" name="zxjxjhh" style="display:none"><option value="">全部</option><option value="2025-2026-2-1" selected>2025-2026学年春</option></select><div class="chosen-container chosen-container-single"><a class="chosen-single"><span>2025-2026学年春</span></a></div></div>
            <div class="profile-info-name">成绩类型</div>
            <div class="profile-info-value"><select class="control-select" name="cjlx"><option>全部</option></select></div>
            <div class="profile-info-name">课程号</div>
            <div class="profile-info-value"><input type="text" name="kch" id="course-code"></div>
            <div class="profile-info-name">课程名</div>
            <div class="profile-info-value"><input type="text" name="kcm" id="course-name"></div>
          </div>
        </div>
        <div class="form-group"><button type="submit" onclick="search();return false;">查询</button></div>
      </form>
      <table class="table table-bordered" id="score-table"><thead><tr><th>课程</th><th>成绩</th><th>学分</th></tr></thead><tbody><tr><td>示例课程</td><td>95</td><td>3</td></tr></tbody></table>
    </div>
  </main>
</body>
</html>
