<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>选课页课表 fixture</title>
  <style>
    html, body { margin: 0; color: #393939; background: #fff; font: 14px Arial, sans-serif; }
    .page-content { padding: 16px; }
    .table { border-collapse: collapse; }
    .table td, .table th { border: 1px solid #ddd; padding: 6px 10px; }
    #div_kb { overflow: hidden auto; max-height: 900px; }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <div class="page-content" id="page-content-template">
      <div id="div_kb">
        <div id="myselectTable">
          <table class="table table-bordered" id="courseTable">
            <thead>
              <tr id="courseTableHead">
                <th colspan="2">节次/时间</th>
                <th>一</th>
                <th>二</th>
              </tr>
            </thead>
            <tbody id="courseTableBody">
              <tr>
                <td>1-2节</td>
                <td>08:00-09:40</td>
                <!-- 占用与空闲都由站点写在单元格的内联底色上（#8EBDDD / #C8D2D8）。
                     空闲那格是浅色，正好落在「清浅色内联背景」与 editorial 皮肤的
                     transparent !important 双重打击范围内，抹掉后整片只剩占用色。 -->
                <td id="occupied-cell" style="background-color: #8EBDDD;">测试课程 A</td>
                <td id="free-cell" style="background-color: #C8D2D8;"></td>
              </tr>
              <tr>
                <td>3-4节</td>
                <td>10:00-11:40</td>
                <td id="free-cell-2" style="background-color: #C8D2D8;"></td>
                <td id="occupied-cell-2" style="background-color: #8EBDDD;">测试课程 B</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
