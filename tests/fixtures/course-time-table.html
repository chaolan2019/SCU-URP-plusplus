<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>选课页课表 fixture</title>
  <style>
    html, body { margin: 0; color: #393939; background: #fff; font: 14px Arial, sans-serif; }
    .page-content { padding: 16px; }
    .table { border-collapse: collapse; }
    .table td, .table th { border: 1px solid #ddd; padding: 6px 10px; }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <div class="page-content" id="page-content-template">
      <!-- 复刻真实页面：容器是 #soliderbox，网格是 #courseTable，单元格 id 形如 日_节 -->
      <div id="soliderbox">
        <table class="table table-bordered" id="courseTable">
          <thead>
            <tr id="courseTableHead">
              <th colspan="1">节次/时间</th>
              <th>一</th>
              <th>二</th>
            </tr>
          </thead>
          <tbody id="courseTableBody">
            <!-- 站点先把整片网格画成同一个底色；「空闲」要等它自己的 divBuild
                 再刷回浅灰。占用 / 空闲的区别只用 title 表达（真实页面如此）。 -->
            <tr>
              <th id="0_1">1</th>
              <td id="1_1" title="世界民族问题研究_01" style="background-color: #8EBDDD;">世界民族问题研究_01</td>
              <td id="2_1" title="" style="background-color: #8EBDDD;"></td>
            </tr>
            <tr>
              <th id="0_2">2</th>
              <td id="1_2" title="" style="background-color: #8EBDDD;"></td>
              <td id="2_2" title="模拟电子技术基础实验（Ⅱ）_08" style="background-color: #8EBDDD;">模拟电子技术基础实验（Ⅱ）_08</td>
            </tr>
          </tbody>
        </table>
        <button type="button" id="open-filter" onclick="openFilter()">点击打开时间筛选器</button>
      </div>
    </div>
  </main>
  <script>
    window.__divBuildRuns = 0;

    // 站点自己的渲染函数：画完底色、摆好卡片。空闲的刷成蓝（可选的时段），
    // 占用的留空（由里面的课程卡片自己表达）。写的是普通内联值，不带 !important。
    window.divBuild = function () {
      window.__divBuildRuns += 1;
      document.querySelectorAll('#courseTableBody td').forEach(function (cell) {
        var occupied = !!cell.getAttribute('title');
        cell.style.setProperty('background-color', occupied ? 'rgba(0, 0, 0, 0)' : '#8EBDDD');
      });
    };

    // 展开筛选面板时站点会重新跑一次渲染
    function openFilter() {
      window.divBuild();
    }

    // 站点按自己的节奏先画一遍（此时插件尚未注入）
    window.divBuild();
  </script>
</body>
</html>
